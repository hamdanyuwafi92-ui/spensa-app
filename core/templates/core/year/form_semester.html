<div class="modal-overlay" id="modalSemesterForm">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalSemesterTitle">Tambah Semester</h3>
            <button class="modal-close" onclick="closeModal('modalSemesterForm')">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <form id="semesterForm" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Nama Semester</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn btn-word">Simpan</button>
                <button type="button"
                        class="btn btn-access"
                        onclick="closeModal('modalSemesterForm')">Batal</button>
            </div>
        </form>
    </div>
</div>
