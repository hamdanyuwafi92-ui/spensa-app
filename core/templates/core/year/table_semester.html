<table>
    <thead>
        <tr>
            <th>Nama Semester</th>
            <th>Aksi</th>
        </tr>
    </thead>
    <tbody>
        {% for semester in semesters %}
            <tr>
                <td>{{ semester.name }}</td>
                <td>
                    <button class="btn btn-sm btn-excel"
                            onclick="editSemester({{ semester.id }}, '{{ semester.name }}')">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <button class="btn btn-sm btn-access"
                            onclick="confirmDelete('{% url 'core:semester_delete' semester.id %}')">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="2">Belum ada semester.</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
