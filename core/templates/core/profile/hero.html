<div class="grid-cards">
    <div class="card-stat c-word glass-panel">
        <div class="stat-info">
            <h4>{{ profile.fullname }}</h4>
            <h2>{{ profile.job|default:"Siswa" }}</h2>
        </div>
        <div class="stat-icon">
            {% if profile.photo %}
                <img src="{{ profile.photo.url }}"
                     alt="Foto {{ profile.fullname }}"
                     class="table-thumbnail">
            {% else %}
                <i class="fa-solid fa-user"></i>
            {% endif %}
        </div>
    </div>
</div>
