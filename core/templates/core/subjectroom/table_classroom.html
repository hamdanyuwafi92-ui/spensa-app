<table>
    <thead>
        <tr>
            <th>Jenjang</th>
            <th>Kelas</th>
            <th>Aksi</th>
        </tr>
    </thead>
    <tbody>
        {% for classroom in classrooms %}
            <tr>
                <td>{{ classroom.mainclassroom }}</td>
                <td>{{ classroom.name }}</td>
                <td>
                    <button class="btn btn-sm btn-excel"
                            onclick="editClassroom({{ classroom.id }}, '{{ classroom.mainclassroom }}', '{{ classroom.name }}')">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <button class="btn btn-sm btn-access"
                            onclick="confirmDeleteClassroom('{% url 'core:classroom_delete' classroom.id %}')">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="3">Belum ada kelas.</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
