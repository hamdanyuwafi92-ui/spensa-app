<div class="modal-overlay" id="modalClassroomForm">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalClassroomTitle">Tambah Kelas</h3>
            <button class="modal-close" onclick="closeModal('modalClassroomForm')">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <form id="classroomForm" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Jenjang</label>
                <select name="mainclassroom" class="form-control" id="classroomMain" required>
                    <option value="">---------</option>
                    {% for value, label in level_choices %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Nama Kelas</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            {% if form.errors %}
                <div class="form-error">{{ form.errors }}</div>
            {% endif %}
            <div class="btn-group">
                <button type="submit" class="btn btn-word">Simpan</button>
                <button type="button"
                        class="btn btn-access"
                        onclick="closeModal('modalClassroomForm')">Batal</button>
            </div>
        </form>
    </div>
</div>
