<table>
    <thead>
        <tr>
            <th>Kode</th>
            <th>Nama</th>
            <th>Aksi</th>
        </tr>
    </thead>
    <tbody>
        {% for subject in subjects %}
            <tr>
                <td>{{ subject.code }}</td>
                <td>{{ subject.name }}</td>
                <td>
                    <button class="btn btn-sm btn-excel"
                            onclick="editSubject({{ subject.id }}, '{{ subject.code }}', '{{ subject.name }}')">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <button class="btn btn-sm btn-access"
                            onclick="confirmDeleteSubject('{% url 'core:subject_delete' subject.id %}')">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="3">Belum ada mapel.</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
