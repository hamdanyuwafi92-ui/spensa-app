<div class="card glass-panel">
    <table>
        <thead>
            <tr>
                <th>Kode</th>
                <th>Nama</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody>
            {% for club in clubs %}
                <tr>
                    <td>{{ club.code }}</td>
                    <td>{{ club.name }}</td>
                    <td>
                        <button class="btn btn-sm btn-excel"
                                onclick="editClub({{ club.id }}, '{{ club.code }}', '{{ club.name }}')">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button class="btn btn-sm btn-access"
                                onclick="confirmDeleteClub('{% url 'core:club_delete' club.id %}')">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="3">Belum ada ekstrakurikuler.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
